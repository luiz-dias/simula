<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Matéria</div>
    <div class="page-subtitle">Informações da matéria</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid" (ngSubmit)="salvar()">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <div class="form-actions">
        <button type="button" mat-stroked-button routerLink="/materias">Cancelar</button>
        <button type="submit" mat-raised-button color="primary">Salvar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<div class="page-header">
  <div>
    <div class="page-title">Matérias</div>
    <div class="page-subtitle">Lista de matérias cadastradas</div>
  </div>
  <button mat-raised-button color="primary" routerLink="/materias/novo">
    Nova matéria
  </button>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="materias" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let materia">{{ materia.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let materia">{{ materia.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let materia">{{ materia.descricao }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let materia">
          <div class="table-actions">
            <button mat-icon-button color="primary" [routerLink]="['/materias', materia.id]">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>

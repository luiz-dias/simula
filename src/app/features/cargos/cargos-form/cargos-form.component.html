<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Cargo</div>
    <div class="page-subtitle">Informações do cargo</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid" (ngSubmit)="salvar()">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Órgão</mat-label>
        <mat-select formControlName="orgaoId">
          <mat-option *ngFor="let orgao of orgaos" [value]="orgao.id">
            {{ orgao.nome }}
          </mat-option>
        </mat-select>
      </mat-form-field>
        <div class="form-actions">
        <button type="button" mat-stroked-button routerLink="/cargos">Cancelar</button>
        <button type="submit" mat-raised-button color="primary">Salvar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

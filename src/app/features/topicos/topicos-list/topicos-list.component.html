<div class="page-header">
  <div>
    <div class="page-title">Tópicos</div>
    <div class="page-subtitle">Lista de tópicos cadastrados</div>
  </div>
  <button mat-raised-button color="primary" routerLink="/topicos/novo">
    Novo tópico
  </button>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="topicos" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let topico">{{ topico.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let topico">{{ topico.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="assunto">
        <th mat-header-cell *matHeaderCellDef>Assunto</th>
        <td mat-cell *matCellDef="let topico">{{ topico.assunto }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let topico">
          <div class="table-actions">
            <button mat-icon-button color="primary" [routerLink]="['/topicos', topico.id]">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>

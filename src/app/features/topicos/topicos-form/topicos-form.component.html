<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Tópico</div>
    <div class="page-subtitle">Informações do tópico</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid" (ngSubmit)="salvar()">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Assunto</mat-label>
        <mat-select formControlName="assuntoId">
          <mat-option *ngFor="let assunto of assuntos" [value]="assunto.id">
            {{ assunto.nome }} | {{ assunto.materia?.nome ?? '' }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <div class="form-actions">
        <button type="button" mat-stroked-button routerLink="/topicos">Cancelar</button>
        <button type="submit" mat-raised-button color="primary">Salvar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

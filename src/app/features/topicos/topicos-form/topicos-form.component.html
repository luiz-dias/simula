<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Tópico</div>
    <div class="page-subtitle">Informações do tópico</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Assunto</mat-label>
        <mat-select formControlName="assunto">
          <mat-option *ngFor="let assunto of assuntos" [value]="assunto.nome">
            {{ assunto.nome }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
    <div class="form-actions">
      <button mat-stroked-button routerLink="/topicos">Cancelar</button>
      <button mat-raised-button color="primary">Salvar</button>
    </div>
  </mat-card-content>
</mat-card>

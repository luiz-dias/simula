<div class="page-header">
  <div>
    <div class="page-title">Assuntos</div>
    <div class="page-subtitle">Lista de assuntos cadastrados</div>
  </div>
  <button mat-raised-button color="primary" routerLink="/assuntos/novo">
    Novo assunto
  </button>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="assuntos" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let assunto">{{ assunto.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let assunto">{{ assunto.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="materia">
        <th mat-header-cell *matHeaderCellDef>Matéria</th>
        <td mat-cell *matCellDef="let assunto">{{ assunto.materia }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let assunto">
          <div class="table-actions">
            <button mat-icon-button color="primary" [routerLink]="['/assuntos', assunto.id]">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>

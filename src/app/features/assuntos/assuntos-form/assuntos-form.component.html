<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Assunto</div>
    <div class="page-subtitle">Informações do assunto</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Matéria</mat-label>
        <mat-select formControlName="materia">
          <mat-option *ngFor="let materia of materias" [value]="materia.nome">
            {{ materia.nome }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
    <div class="form-actions">
      <button mat-stroked-button routerLink="/assuntos">Cancelar</button>
      <button mat-raised-button color="primary">Salvar</button>
    </div>
  </mat-card-content>
</mat-card>

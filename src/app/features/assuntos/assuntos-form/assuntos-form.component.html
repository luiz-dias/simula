<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Assunto</div>
    <div class="page-subtitle">Informações do assunto</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid" (ngSubmit)="salvar()">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Matéria</mat-label>
        <mat-select formControlName="materiaId">
          <mat-option *ngFor="let materia of materias" [value]="materia.id">
            {{ materia.nome }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <div class="form-actions">
        <button type="button" mat-stroked-button routerLink="/assuntos">Cancelar</button>
        <button type="submit" mat-raised-button color="primary">Salvar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

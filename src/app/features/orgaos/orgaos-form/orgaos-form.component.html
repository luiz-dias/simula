<div class="page-header">
  <div>
    <div class="page-title">Criar/Editar Órgão</div>
    <div class="page-subtitle">Informações do órgão</div>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Sigla</mat-label>
        <input matInput formControlName="sigla" />
      </mat-form-field>
    </form>
    <div class="form-actions">
      <button mat-stroked-button routerLink="/orgaos">Cancelar</button>
      <button mat-raised-button color="primary">Salvar</button>
    </div>
  </mat-card-content>
</mat-card>

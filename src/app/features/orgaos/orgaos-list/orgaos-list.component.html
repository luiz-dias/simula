<div class="page-header">
  <div>
    <div class="page-title">Órgãos</div>
    <div class="page-subtitle">Lista de órgãos cadastrados</div>
  </div>
  <button mat-raised-button color="primary" routerLink="/orgaos/novo">
    Novo órgão
  </button>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="orgaos" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let orgao">{{ orgao.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let orgao">{{ orgao.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="sigla">
        <th mat-header-cell *matHeaderCellDef>Sigla</th>
        <td mat-cell *matCellDef="let orgao">{{ orgao.sigla }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let orgao">
          <div class="table-actions">
            <button mat-icon-button color="primary" [routerLink]="['/orgaos', orgao.id]">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>

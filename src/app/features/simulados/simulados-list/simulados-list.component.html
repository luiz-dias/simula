<div class="page-header">
  <div>
    <div class="page-title">Simulados</div>
    <div class="page-subtitle">Filtre por cargo, órgão e ano</div>
  </div>
  <button mat-stroked-button color="primary" routerLink="/montar-simulado">
    Montar simulado
  </button>
</div>

<mat-card>
  <mat-card-content>
    <div class="grid grid-3">
      <mat-form-field appearance="outline">
        <mat-label>Órgão</mat-label>
        <input matInput placeholder="Ex: TCU" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Cargo</mat-label>
        <input matInput placeholder="Ex: Analista" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Ano</mat-label>
        <input matInput type="number" placeholder="Ex: 2024" />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="simulados" class="full-width">
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let simulado">{{ simulado.titulo }}</td>
      </ng-container>
      <ng-container matColumnDef="orgao">
        <th mat-header-cell *matHeaderCellDef>Órgão</th>
        <td mat-cell *matCellDef="let simulado">{{ simulado.orgao }}</td>
      </ng-container>
      <ng-container matColumnDef="cargo">
        <th mat-header-cell *matHeaderCellDef>Cargo</th>
        <td mat-cell *matCellDef="let simulado">{{ simulado.cargo }}</td>
      </ng-container>
      <ng-container matColumnDef="ano">
        <th mat-header-cell *matHeaderCellDef>Ano</th>
        <td mat-cell *matCellDef="let simulado">{{ simulado.ano }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let simulado">
          <div class="table-actions">
            <button mat-icon-button color="primary" [routerLink]="['/simulados', simulado.id]">
              <mat-icon>visibility</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>

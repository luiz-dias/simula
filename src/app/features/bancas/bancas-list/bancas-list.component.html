<div class="page-header">
  <div>
    <div class="page-title">Bancas</div>
    <div class="page-subtitle">Lista de bancas cadastradas</div>
  </div>
  <button mat-raised-button color="primary" routerLink="/bancas/novo">
    Nova banca
  </button>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="bancas" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let banca">{{ banca.id }}</td>
      </ng-container>
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let banca">{{ banca.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="sigla">
        <th mat-header-cell *matHeaderCellDef>Sigla</th>
        <td mat-cell *matCellDef="let banca">{{ banca.sigla }}</td>
      </ng-container>
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let banca">
          <div class="table-actions">
            <button mat-icon-button color="primary" [routerLink]="['/bancas', banca.id]">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletar(banca)" matTooltip="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>

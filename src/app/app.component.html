<mat-sidenav-container class="app-shell">
  <mat-sidenav mode="side" opened class="app-sidenav">
    <div class="brand">
      <mat-icon>school</mat-icon>
      <div>
        <div class="brand-title">{{ title }}</div>
        <div class="brand-subtitle">Sistema Gerador de Simulados</div>
      </div>
    </div>

    <div class="nav-section" *ngFor="let section of navSections">
      <div class="nav-title">{{ section.title }}</div>
      <mat-nav-list>
        <a
          mat-list-item
          *ngFor="let link of section.links"
          [routerLink]="link.path"
          routerLinkActive="active-link"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <span class="toolbar-title">Gerenciador de Simulados</span>
      <span class="spacer"></span>
      <button mat-icon-button matTooltip="Notificações">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Configurações">
        <mat-icon>settings</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Perfil">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <div class="app-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
